name: ci

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  strict-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enforce UI date-input policy
        run: bash ./scripts/check-ui-date-inputs.sh

      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      - name: Show Podman version
        run: podman --version

      - name: Run strict CI checks (container-first)
        env:
          TEST_ADMIN_EMAIL: admin@example.com
          TEST_ADMIN_PASSWORD: ChangeMe123!
        run: bash ./scripts/ci-strict.sh
